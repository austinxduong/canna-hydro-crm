services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: cannahydro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cannahydro
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: cannahydro_dev
    ports:
      - "5432:5432"
    volumes:
      - cannahydro_pgdata:/var/lib/postgresql/data

volumes:
  cannahydro_pgdata: